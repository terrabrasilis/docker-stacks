# Used for deploy metadata-app stack
version: '3.4'

services:
  geonetwork:
    image: terrabrasilis/geonetwork:v4.4.12
    networks:
      - proxy
      - backend
    ports:
      - "8080"
    environment:
      GEONETWORK_DB_HOST: ${GEONETWORK_DB_HOST:-}
      GEONETWORK_DB_PORT: ${GEONETWORK_DB_PORT:-}
      GEONETWORK_DB_NAME: ${GEONETWORK_DB_NAME:-}
      WEBAPP_CONTEXT_PATH: /geonetwork
      REMOTE_IP_INTERNAL_PROXIES: ${METADATA_TRUSTED_PROXIES:-}
    secrets:
      - geonetwork_db_username
      - geonetwork_db_password
    volumes:
      - /data/metadata/catalogue:/catalogue-data
    deploy:
      replicas: 1
      placement:
        constraints:
          # force the service on node5 because its has more memory than others
          - node.hostname==node5
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.26
    networks:
      - backend
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    volumes:
      - /data/metadata/elasticsearch:/usr/share/elasticsearch/data
    deploy:
      replicas: 1
      placement:
        constraints:
          # force the service on node5 because its has more memory than others
          - node.hostname==node5
      resources:
        limits:
          memory: 2G

networks:
  proxy:
    external: true
  backend:
    external: true

secrets:
  geonetwork_db_username:
    external: true
  geonetwork_db_password:
    external: true
